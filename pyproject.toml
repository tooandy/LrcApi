[project]
name = "home-lrcapi"
version = "2.0.0"
description = "Private read-only lyrics gateway with curated SQLite confirmations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask>=3.1.3,<4",
  "waitress>=3.0.2,<4",
  "requests>=2.32.4,<3",
  "aiohttp>=3.13.4,<4",
  "mutagen>=1.47,<2",
  "pillow>=12,<14",
  "mygo>=1.0.1,<2",
  "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pip-audit>=2.10,<3",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:invalid escape sequence:SyntaxWarning"]

[tool.ruff]
target-version = "py312"
line-length = 110
