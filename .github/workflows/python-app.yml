name: Home LrcAPI · Python 3.12 / uv

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify Python version
        run: uv run --locked python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Static critical errors
        run: uv run --locked ruff check app.py api mod tests --select E9,F63,F7,F82
      - name: Regression / protocol contracts
        run: uv run --locked pytest -q
      - name: Dark/light/system theme UI behavior
        run: node --test tests/theme.test.mjs
      - name: Audit installed Python packages
        run: uv run --locked pip-audit --path .venv/lib/python3.12/site-packages
